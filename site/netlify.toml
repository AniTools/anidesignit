# Netlify build + hosting for the static site.
# Keystatic runs locally (`npm run dev` → /keystatic) and writes content files
# into this project; deploying is what publishes them.

[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The design system's webfonts and images are content-hashed by Astro.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
